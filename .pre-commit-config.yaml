repos:
  - repo: local
    hooks:
      - id: ruff-format-check
        name: ruff format check
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: ruff-check
        name: ruff lint
        entry: uv run ruff check
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy src
        language: system
        pass_filenames: false
      - id: pytest-fast
        name: pytest fast
        entry: 'uv run pytest -m "not slow and not gpu"'
        language: system
        pass_filenames: false

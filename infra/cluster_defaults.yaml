# Conservative fallbacks only. Generate and review a cloud preflight profile
# before producing scripts for a real campaign.
modules:
  - python3.12/3.12
  - cuda/13.0
venv: .venv/bin/activate
python: python
clusters:
  rtx5090:
    partition: P107-RTX5090
    qos: qos_p107-rtx5090
    throttle: 4
    cpus_per_task: 4
    gpus: 1
    time_limit: "12:00:00"
  a100:
    partition: P107-A100
    qos: qos_p107-a100
    throttle: 2
    cpus_per_task: 4
    gpus: 1
    time_limit: "12:00:00"
  cpu:
    partition: CPU-6530
    qos: ""
    throttle: 8
    cpus_per_task: 16
    gpus: 0
    time_limit: "08:00:00"
